name: TaskBoard CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test Python + Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Запустить pytest
        run: python -m pytest -q
      - name: Проверить Dockerfile
        run: docker build --tag taskboard:ci .

  publish:
    name: Push immutable image to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Определить имя образа
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Ubuntu via SSH
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Передать конфигурацию и запустить выкладку
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/taskboard_key
          chmod 600 ~/.ssh/taskboard_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          CONNECT=( -i ~/.ssh/taskboard_key -o BatchMode=yes -o StrictHostKeyChecking=yes )
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "${CONNECT[@]}" "$REMOTE" 'mkdir -p /opt/devops-taskboard/nginx /opt/devops-taskboard/scripts'
          scp "${CONNECT[@]}" compose.prod.yaml "$REMOTE:/opt/devops-taskboard/"
          scp "${CONNECT[@]}" nginx/default.conf "$REMOTE:/opt/devops-taskboard/nginx/"
          scp "${CONNECT[@]}" scripts/deploy.sh scripts/rollback.sh scripts/server-preflight.sh "$REMOTE:/opt/devops-taskboard/scripts/"
          ssh "${CONNECT[@]}" "$REMOTE" "cd /opt/devops-taskboard && bash scripts/deploy.sh '$IMAGE'"
